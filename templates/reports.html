<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Health Reports - HealthPro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <style>
        * {
            font-family: 'Poppins', 'Segoe UI', sans-serif;
        }
        
        body {
            background: #f5f7fb;
            transition: all 0.3s ease;
        }
        
        body.dark-mode {
            background: #1a1a2e;
            color: #ffffff;
        }
        
        body.dark-mode .report-card,
        body.dark-mode .filter-bar,
        body.dark-mode .stat-box {
            background: #16213e;
            color: #ffffff;
            border: 1px solid #2c3e50;
        }
        
        body.dark-mode .table-light {
            background: #0f3460;
            color: #ffffff;
        }
        
        .sidebar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
            transition: all 0.3s;
        }
        
        body.dark-mode .sidebar {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-right: 1px solid #2c3e50;
        }
        
        .sidebar .nav-link {
            color: rgba(255,255,255,0.8);
            padding: 12px 20px;
            margin: 5px 0;
            border-radius: 10px;
            transition: all 0.3s;
        }
        
        .sidebar .nav-link:hover, .sidebar .nav-link.active {
            background: rgba(255,255,255,0.2);
            color: white;
            transform: translateX(5px);
        }
        
        .sidebar .nav-link i {
            width: 25px;
            margin-right: 10px;
        }
        
        .report-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            margin-bottom: 25px;
            transition: all 0.3s;
        }
        
        .report-card:hover {
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
        }
        
        .filter-bar {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }
        
        .stat-box {
            background: linear-gradient(135deg, #667eea15, #764ba215);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            transition: all 0.3s;
            cursor: pointer;
        }
        
        .stat-box:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        
        .print-btn {
            background: linear-gradient(135deg, #6c757d, #495057);
            border: none;
            border-radius: 10px;
            padding: 10px 25px;
            color: white;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .print-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(108,117,125,0.3);
        }
        
        .pdf-btn {
            background: linear-gradient(135deg, #dc3545, #c82333);
            border: none;
            border-radius: 10px;
            padding: 10px 25px;
            color: white;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .pdf-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(220,53,69,0.3);
        }
        
        .excel-btn {
            background: linear-gradient(135deg, #28a745, #20c997);
            border: none;
            border-radius: 10px;
            padding: 10px 25px;
            color: white;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .excel-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(40,167,69,0.3);
        }
        
        .btn-generate {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 10px;
            padding: 12px 25px;
            color: white;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102,126,234,0.4);
        }
        
        .form-control, .form-select {
            border-radius: 12px;
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            transition: all 0.3s;
        }
        
        .form-control:focus, .form-select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102,126,234,0.25);
        }
        
        /* Health Score Gauge */
        .gauge-container {
            position: relative;
            width: 150px;
            margin: 0 auto;
        }
        
        .gauge-value {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 28px;
            font-weight: bold;
        }
        
        /* Loading Animation */
        .loader {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Toast Notification */
        .toast-notification {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            min-width: 320px;
            padding: 15px 20px;
            border-radius: 12px;
            color: white;
            animation: slideIn 0.3s ease;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .toast-success { background: linear-gradient(135deg, #11998e, #38ef7d); }
        .toast-error { background: linear-gradient(135deg, #eb3349, #f45c43); }
        .toast-warning { background: linear-gradient(135deg, #f2994a, #f2c94c); }
        
        @media print {
            .sidebar, .btn, .filter-bar, .navbar, .print-btn, .pdf-btn, .excel-btn, .btn-generate {
                display: none !important;
            }
            .col-md-10 {
                width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            .report-card {
                box-shadow: none;
                padding: 10px;
                break-inside: avoid;
            }
            body {
                background: white;
            }
        }
        
        @media (max-width: 768px) {
            .sidebar {
                min-height: auto;
                position: fixed;
                bottom: 0;
                width: 100%;
                z-index: 1000;
            }
            .col-md-10 {
                margin-bottom: 80px;
            }
        }
    </style>
</head>
<body>
    <div id="toastContainer"></div>
    
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 p-0">
                <div class="sidebar p-3">
                    <h4 class="text-center mb-4 mt-3">
                        <i class="fas fa-heartbeat me-2"></i>HealthPro
                    </h4>
                    <hr class="bg-light">
                    <nav class="nav flex-column">
                        <a class="nav-link" href="/dashboard">
                            <i class="fas fa-tachometer-alt"></i> Dashboard
                        </a>
                        <a class="nav-link" href="/history">
                            <i class="fas fa-history"></i> Health History
                        </a>
                        <a class="nav-link active" href="/reports">
                            <i class="fas fa-chart-line"></i> Reports
                        </a>
                        <a class="nav-link" href="/goals">
                            <i class="fas fa-bullseye"></i> Health Goals
                        </a>
                         <a class="nav-link" href="/batch-analyze">
                            <i class="fas fa-database"></i> Batch ML Analyze
                        </a>
                        <hr class="bg-light">
                        <a class="nav-link" href="#" onclick="toggleDarkMode()">
                            <i class="fas fa-moon"></i> Dark Mode
                        </a>
                        <a class="nav-link" href="#" onclick="logout()">
                            <i class="fas fa-sign-out-alt"></i> Logout
                        </a>
                    </nav>
                </div>
            </div>
            
            <!-- Main Content -->
            <div class="col-md-10 p-4">
                <!-- Header -->
                <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap">
                    <div>
                        <h2><i class="fas fa-chart-line me-2"></i>Health Reports</h2>
                        <p class="text-muted mb-0">Generate detailed health analytics and insights</p>
                    </div>
                    <div class="mt-2 mt-md-0">
                        <button class="print-btn me-2" onclick="window.print()">
                            <i class="fas fa-print me-2"></i>Print
                        </button>
                        <button class="pdf-btn me-2" onclick="downloadPDF()">
                            <i class="fas fa-file-pdf me-2"></i>PDF
                        </button>
                        <button class="excel-btn" onclick="exportToExcel()">
                            <i class="fas fa-file-excel me-2"></i>Excel
                        </button>
                    </div>
                </div>
                
                <!-- Report Type Selector -->
                <div class="filter-bar">
                    <div class="row align-items-end">
                        <div class="col-md-3 mb-3 mb-md-0">
                            <label class="form-label"><i class="fas fa-chart-pie me-1"></i>Report Type</label>
                            <select class="form-select" id="reportType">
                                <option value="health">Health Summary</option>
                                <option value="vitals">Vitals Analysis</option>
                                <option value="activity">Activity Report</option>
                                <option value="sleep">Sleep Analysis</option>
                                <option value="comprehensive">Comprehensive Report</option>
                            </select>
                        </div>
                        <div class="col-md-3 mb-3 mb-md-0">
                            <label class="form-label"><i class="far fa-calendar-alt me-1"></i>Start Date</label>
                            <input type="date" class="form-control" id="reportStartDate">
                        </div>
                        <div class="col-md-3 mb-3 mb-md-0">
                            <label class="form-label"><i class="far fa-calendar-alt me-1"></i>End Date</label>
                            <input type="date" class="form-control" id="reportEndDate">
                        </div>
                        <div class="col-md-3">
                            <button class="btn-generate w-100" onclick="generateReport()" id="generateBtn">
                                <i class="fas fa-chart-line me-2"></i>Generate Report
                            </button>
                        </div>
                    </div>
                </div>
                
                <!-- Report Content -->
                <div id="reportContent">
                    <div class="report-card text-center py-5">
                        <i class="fas fa-chart-line fa-4x text-muted mb-3"></i>
                        <h5 class="text-muted">Select date range and click "Generate Report"</h5>
                        <p class="text-muted small">Get detailed insights about your health trends</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    
    <script>
        let currentReport = null;
        let trendChart = null;
        let distributionChart = null;
        
        // Initialize default dates
        const endDate = new Date();
        const startDate = new Date();
        startDate.setDate(startDate.getDate() - 30);
        document.getElementById('reportStartDate').value = startDate.toISOString().split('T')[0];
        document.getElementById('reportEndDate').value = endDate.toISOString().split('T')[0];
        
        async function generateReport() {
            const startDate = document.getElementById('reportStartDate').value;
            const endDate = document.getElementById('reportEndDate').value;
            const reportType = document.getElementById('reportType').value;
            
            if (!startDate || !endDate) {
                showToast('Please select both start and end dates', 'error');
                return;
            }
            
            const generateBtn = document.getElementById('generateBtn');
            generateBtn.disabled = true;
            generateBtn.innerHTML = '<span class="loader" style="width:20px;height:20px;border-width:2px;"></span> Generating...';
            
            try {
                const response = await fetch(`/api/reports?start_date=${startDate}&end_date=${endDate}&type=${reportType}`);
                const data = await response.json();
                
                if (!response.ok) {
                    showToast(data.error || 'No data found for selected date range', 'error');
                    generateBtn.disabled = false;
                    generateBtn.innerHTML = '<i class="fas fa-chart-line me-2"></i>Generate Report';
                    return;
                }
                
                currentReport = data.report;
                displayReport(data.report, reportType);
                showToast('Report generated successfully!', 'success');
            } catch (error) {
                console.error('Error generating report:', error);
                showToast('Error generating report. Please try again.', 'error');
            } finally {
                generateBtn.disabled = false;
                generateBtn.innerHTML = '<i class="fas fa-chart-line me-2"></i>Generate Report';
            }
        }
        
        function displayReport(report, reportType) {
            const container = document.getElementById('reportContent');
            const summary = report.summary;
            const user = report.user_info;
            
            // Calculate health score
            const healthScore = calculateHealthScore(summary);
            const healthScoreColor = healthScore >= 80 ? 'success' : (healthScore >= 60 ? 'warning' : 'danger');
            
            container.innerHTML = `
                <div class="report-card">
                    <!-- Header -->
                    <div class="text-center mb-4">
                        <div class="mb-3">
                            <i class="fas fa-heartbeat fa-3x" style="background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; background-clip: text; color: transparent;"></i>
                        </div>
                        <h2 class="fw-bold" style="background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; background-clip: text; color: transparent;">
                            Health Monitoring Report
                        </h2>
                        <p class="text-muted">Generated on ${new Date().toLocaleString()}</p>
                        <hr>
                        <div class="row justify-content-center">
                            <div class="col-md-8">
                                <h5>${user?.first_name ? user.first_name + ' ' + (user.last_name || '') : user?.username || 'User'}</h5>
                                <p class="mb-0">${user?.email || ''} | Age: ${user?.age || 'N/A'} | Gender: ${user?.gender || 'N/A'}</p>
                                <small class="text-muted">Report Period: ${report.date_range.start} to ${report.date_range.end}</small>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Health Score Gauge -->
                    <div class="row mb-4">
                        <div class="col-md-4 mx-auto">
                            <div class="stat-box text-center">
                                <h6 class="text-muted mb-3">Overall Health Score</h6>
                                <div class="gauge-container">
                                    <canvas id="healthGauge" width="150" height="150"></canvas>
                                    <div class="gauge-value text-${healthScoreColor}">${healthScore}</div>
                                </div>
                                <p class="mt-3 mb-0">
                                    <span class="badge bg-${healthScoreColor} fs-6">${healthScore >= 80 ? 'Excellent' : (healthScore >= 60 ? 'Good' : 'Needs Attention')}</span>
                                </p>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Summary Statistics -->
                    <h5 class="mb-3"><i class="fas fa-chart-simple me-2"></i>Key Metrics Summary</h5>
                    <div class="row mb-4">
                        <div class="col-md-3 col-6">
                            <div class="stat-box">
                                <i class="fas fa-heartbeat fa-2x text-danger mb-2"></i>
                                <h3 class="mb-0">${summary.avg_heart_rate || '--'}</h3>
                                <p class="mb-0 small">Avg Heart Rate</p>
                                <small class="text-muted">Normal: 60-100 bpm</small>
                            </div>
                        </div>
                        <div class="col-md-3 col-6">
                            <div class="stat-box">
                                <i class="fas fa-tachometer-alt fa-2x text-primary mb-2"></i>
                                <h3 class="mb-0">${summary.avg_systolic_bp || '--'}/${summary.avg_diastolic_bp || '--'}</h3>
                                <p class="mb-0 small">Avg Blood Pressure</p>
                                <small class="text-muted">Normal: 120/80 mmHg</small>
                            </div>
                        </div>
                        <div class="col-md-3 col-6">
                            <div class="stat-box">
                                <i class="fas fa-lungs fa-2x text-info mb-2"></i>
                                <h3 class="mb-0">${summary.avg_blood_oxygen || '--'}%</h3>
                                <p class="mb-0 small">Avg Blood Oxygen</p>
                                <small class="text-muted">Normal: ≥95%</small>
                            </div>
                        </div>
                        <div class="col-md-3 col-6">
                            <div class="stat-box">
                                <i class="fas fa-shoe-prints fa-2x text-success mb-2"></i>
                                <h3 class="mb-0">${(summary.total_steps || 0).toLocaleString()}</h3>
                                <p class="mb-0 small">Total Steps</p>
                                <small class="text-muted">${report.daily_data?.length || 0} days</small>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Additional Metrics Row -->
                    <div class="row mb-4">
                        <div class="col-md-3 col-6">
                            <div class="stat-box">
                                <i class="fas fa-bed fa-2x text-primary mb-2"></i>
                                <h4 class="mb-0">${summary.avg_sleep_hours || '--'} hrs</h4>
                                <small class="text-muted">Avg Sleep</small>
                            </div>
                        </div>
                        <div class="col-md-3 col-6">
                            <div class="stat-box">
                                <i class="fas fa-tint fa-2x text-info mb-2"></i>
                                <h4 class="mb-0">${summary.avg_water_intake || '--'} ml</h4>
                                <small class="text-muted">Avg Water</small>
                            </div>
                        </div>
                        <div class="col-md-3 col-6">
                            <div class="stat-box">
                                <i class="fas fa-brain fa-2x text-warning mb-2"></i>
                                <h4 class="mb-0">${summary.avg_stress || '--'}/10</h4>
                                <small class="text-muted">Avg Stress</small>
                            </div>
                        </div>
                        <div class="col-md-3 col-6">
                            <div class="stat-box">
                                <i class="fas fa-chart-line fa-2x text-success mb-2"></i>
                                <h4 class="mb-0">${summary.total_records || 0}</h4>
                                <small class="text-muted">Total Records</small>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Charts Row -->
                    <div class="row mb-4">
                        <div class="col-md-7">
                            <h6><i class="fas fa-chart-line me-2"></i>Health Trends (Last 30 Days)</h6>
                            <canvas id="trendCanvas" height="150"></canvas>
                        </div>
                        <div class="col-md-5">
                            <h6><i class="fas fa-chart-pie me-2"></i>Alert Distribution</h6>
                            <canvas id="distributionCanvas" height="150"></canvas>
                        </div>
                    </div>
                    
                    <!-- Insights and Recommendations -->
                    <div class="row mb-4">
                        <div class="col-md-6">
                            <div class="stat-box text-start">
                                <h6><i class="fas fa-lightbulb text-warning me-2"></i>Key Insights</h6>
                                <ul class="mb-0 small">
                                    ${generateInsights(summary).map(i => `<li class="mb-1">${i}</li>`).join('')}
                                </ul>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="stat-box text-start">
                                <h6><i class="fas fa-star text-success me-2"></i>Recommendations</h6>
                                <ul class="mb-0 small">
                                    ${generateRecommendations(summary).map(r => `<li class="mb-1">${r}</li>`).join('')}
                                </ul>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Daily Records Table -->
                    <h5 class="mb-3"><i class="fas fa-table me-2"></i>Daily Records</h5>
                    <div class="table-responsive">
                        <table class="table table-sm table-bordered table-hover">
                            <thead class="table-light">
                                <tr><th>Date</th><th>Heart Rate</th><th>BP (S/D)</th><th>SpO2</th><th>Steps</th><th>Sleep</th><th>Stress</th><th>Status</th></tr>
                            </thead>
                            <tbody>
                                ${(report.daily_data || []).slice(0, 20).map(day => `
                                    <tr>
                                        <td>${day.date}</td>
                                        <td class="${getStatusClass(day.heart_rate, 60, 100)}">${day.heart_rate || '--'}</td>
                                        <td>${day.systolic_bp || '--'}/${day.diastolic_bp || '--'}</td>
                                        <td class="${getStatusClass(day.blood_oxygen, 95, 100)}">${day.blood_oxygen || '--'}%</td>
                                        <td>${(day.steps || 0).toLocaleString()}</td>
                                        <td>${day.sleep_hours || '--'}h</td>
                                        <td>${day.stress_level || '--'}/10</td>
                                        <td><span class="badge ${getStatusBadge(day)}">${getStatusText(day)}</span></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                        ${(report.daily_data?.length || 0) > 20 ? '<p class="text-muted small mt-2">Showing last 20 records. Export to Excel for complete data.</p>' : ''}
                    </div>
                    
                    <!-- Disclaimer -->
                    <div class="alert alert-info mt-3 small">
                        <i class="fas fa-info-circle me-2"></i>
                        <strong>Disclaimer:</strong> This report is for informational purposes only. 
                        Please consult a healthcare professional for medical advice. The predictions are based on machine learning models and should not replace professional medical diagnosis.
                    </div>
                </div>
            `;
            
            // Initialize charts after DOM is updated
            setTimeout(() => {
                drawHealthGauge(healthScore, healthScoreColor);
                drawTrendChart(report.daily_data || []);
                drawDistributionChart(report.alert_summary || []);
            }, 100);
        }
        
        function calculateHealthScore(summary) {
            let score = 0;
            let total = 0;
            
            if (summary.avg_heart_rate) {
                const hr = summary.avg_heart_rate;
                if (hr >= 60 && hr <= 100) score += 20;
                else if (hr >= 50 && hr <= 110) score += 10;
                total += 20;
            }
            
            if (summary.avg_systolic_bp && summary.avg_diastolic_bp) {
                const sbp = summary.avg_systolic_bp;
                const dbp = summary.avg_diastolic_bp;
                if (sbp >= 90 && sbp <= 120 && dbp >= 60 && dbp <= 80) score += 20;
                else if (sbp >= 80 && sbp <= 140 && dbp >= 50 && dbp <= 90) score += 10;
                total += 20;
            }
            
            if (summary.avg_blood_oxygen) {
                const o2 = summary.avg_blood_oxygen;
                if (o2 >= 95) score += 20;
                else if (o2 >= 90) score += 10;
                total += 20;
            }
            
            if (summary.total_steps && summary.total_records) {
                const avgSteps = summary.total_steps / summary.total_records;
                if (avgSteps >= 8000) score += 20;
                else if (avgSteps >= 5000) score += 10;
                total += 20;
            }
            
            if (summary.avg_sleep_hours) {
                const sleep = summary.avg_sleep_hours;
                if (sleep >= 7 && sleep <= 9) score += 20;
                else if (sleep >= 6 && sleep <= 10) score += 10;
                total += 20;
            }
            
            return total > 0 ? Math.round((score / total) * 100) : 0;
        }
        
        function getStatusClass(value, min, max) {
            if (!value) return '';
            if (value < min) return 'text-warning';
            if (value > max) return 'text-danger';
            return 'text-success';
        }
        
        function getStatusBadge(day) {
            let issues = 0;
            if (day.heart_rate && (day.heart_rate < 60 || day.heart_rate > 100)) issues++;
            if (day.systolic_bp && (day.systolic_bp < 90 || day.systolic_bp > 140)) issues++;
            if (day.blood_oxygen && day.blood_oxygen < 95) issues++;
            if (issues === 0) return 'bg-success';
            if (issues === 1) return 'bg-warning';
            return 'bg-danger';
        }
        
        function getStatusText(day) {
            let issues = 0;
            if (day.heart_rate && (day.heart_rate < 60 || day.heart_rate > 100)) issues++;
            if (day.systolic_bp && (day.systolic_bp < 90 || day.systolic_bp > 140)) issues++;
            if (day.blood_oxygen && day.blood_oxygen < 95) issues++;
            if (issues === 0) return 'Normal';
            if (issues === 1) return 'Warning';
            return 'Critical';
        }
        
        function generateInsights(summary) {
            const insights = [];
            if (summary.avg_heart_rate) {
                if (summary.avg_heart_rate > 90) insights.push('⚠️ Your average heart rate is above normal range');
                else if (summary.avg_heart_rate < 60) insights.push('ℹ️ Your average heart rate is below normal range');
                else insights.push('✅ Your heart rate is within healthy range');
            }
            if (summary.avg_systolic_bp) {
                if (summary.avg_systolic_bp > 130) insights.push('⚠️ Your blood pressure is elevated');
                else if (summary.avg_systolic_bp < 90) insights.push('ℹ️ Your blood pressure is low');
                else insights.push('✅ Your blood pressure is optimal');
            }
            if (summary.total_steps && summary.total_records) {
                const avgSteps = summary.total_steps / summary.total_records;
                if (avgSteps < 5000) insights.push('📉 Low activity level - consider increasing daily steps');
                else if (avgSteps < 8000) insights.push('📊 Moderate activity - good, can improve further');
                else insights.push('🏆 Excellent activity level! Keep it up!');
            }
            return insights;
        }
        
        function generateRecommendations(summary) {
            const recommendations = [];
            if (summary.avg_heart_rate > 90) recommendations.push('Practice deep breathing exercises daily');
            if (summary.avg_systolic_bp > 130) recommendations.push('Reduce sodium intake and increase potassium-rich foods');
            if (summary.avg_blood_oxygen && summary.avg_blood_oxygen < 95) recommendations.push('Consult a doctor about oxygen levels');
            if (summary.total_steps && summary.total_records) {
                const avgSteps = summary.total_steps / summary.total_records;
                if (avgSteps < 5000) recommendations.push('Set a goal of 8000 steps per day');
            }
            if (summary.avg_sleep_hours && summary.avg_sleep_hours < 7) recommendations.push('Aim for 7-8 hours of quality sleep');
            if (recommendations.length === 0) recommendations.push('Continue maintaining your healthy lifestyle!');
            return recommendations.slice(0, 5);
        }
        
        function drawHealthGauge(score, color) {
            const canvas = document.getElementById('healthGauge');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = 60;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Background arc
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
            ctx.strokeStyle = '#e0e0e0';
            ctx.lineWidth = 12;
            ctx.stroke();
            
            // Foreground arc (progress)
            const angle = (score / 100) * 2 * Math.PI;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, -Math.PI / 2, -Math.PI / 2 + angle);
            ctx.strokeStyle = color === 'success' ? '#28a745' : (color === 'warning' ? '#ffc107' : '#dc3545');
            ctx.lineWidth = 12;
            ctx.stroke();
        }
        
        function drawTrendChart(dailyData) {
            const canvas = document.getElementById('trendCanvas');
            if (!canvas || !dailyData.length) return;
            
            const ctx = canvas.getContext('2d');
            const labels = dailyData.slice(-30).map(d => d.date);
            const hrData = dailyData.slice(-30).map(d => d.heart_rate);
            const sbpData = dailyData.slice(-30).map(d => d.systolic_bp);
            
            if (window.trendChartInstance) window.trendChartInstance.destroy();
            
            window.trendChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'Heart Rate (bpm)', data: hrData, borderColor: '#dc3545', backgroundColor: 'rgba(220,53,69,0.1)', tension: 0.4, fill: true },
                        { label: 'Systolic BP (mmHg)', data: sbpData, borderColor: '#0d6efd', backgroundColor: 'rgba(13,110,253,0.1)', tension: 0.4, fill: true }
                    ]
                },
                options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { position: 'top' } } }
            });
        }
        
        function drawDistributionChart(alertSummary) {
            const canvas = document.getElementById('distributionCanvas');
            if (!canvas) return;
            
            const ctx = canvas.getContext('2d');
            const severityMap = { critical: 0, warning: 0, info: 0 };
            (alertSummary || []).forEach(s => { if (severityMap[s.severity] !== undefined) severityMap[s.severity] += s.count; });
            
            const labels = Object.keys(severityMap).filter(l => severityMap[l] > 0);
            const data = labels.map(l => severityMap[l]);
            const colors = labels.map(l => l === 'critical' ? '#dc3545' : (l === 'warning' ? '#ffc107' : '#0dcaf0'));
            
            if (window.distributionChartInstance) window.distributionChartInstance.destroy();
            
            window.distributionChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: { labels: labels, datasets: [{ data: data, backgroundColor: colors, borderWidth: 0 }] },
                options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { position: 'bottom' } } }
            });
        }
        
        function downloadPDF() {
            if (!currentReport) { showToast('Please generate a report first', 'error'); return; }
            const element = document.getElementById('reportContent');
            const opt = { margin: [0.5, 0.5, 0.5, 0.5], filename: `health_report_${currentReport.date_range.start}_to_${currentReport.date_range.end}.pdf`, image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 }, jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' } };
            html2pdf().set(opt).from(element).save();
            showToast('PDF download started', 'success');
        }
        
        function exportToExcel() {
            if (!currentReport || !currentReport.daily_data) { showToast('Please generate a report first', 'error'); return; }
            const data = currentReport.daily_data.map(day => ({ Date: day.date, 'Heart Rate': day.heart_rate, 'Systolic BP': day.systolic_bp, 'Diastolic BP': day.diastolic_bp, 'Blood Oxygen': day.blood_oxygen, Steps: day.steps, 'Sleep Hours': day.sleep_hours, Stress: day.stress_level, Status: getStatusText(day) }));
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Health Report');
            XLSX.writeFile(wb, `health_report_${new Date().toISOString().split('T')[0]}.xlsx`);
            showToast('Excel exported successfully', 'success');
        }
        
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast-notification toast-${type}`;
            toast.innerHTML = `<div class="d-flex align-items-center"><i class="fas fa-${type === 'success' ? 'check-circle' : 'times-circle'} me-2 fa-lg"></i><div class="flex-grow-1">${message}</div><button class="btn-close btn-close-white ms-3" onclick="this.parentElement.parentElement.remove()"></button></div>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }
        
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
        }
        
        if (localStorage.getItem('darkMode') === 'true') document.body.classList.add('dark-mode');
        
        async function logout() { await fetch('/api/logout', { method: 'POST' }); window.location.href = '/'; }
        
        // Auto-generate on load
        generateReport();
    </script>
